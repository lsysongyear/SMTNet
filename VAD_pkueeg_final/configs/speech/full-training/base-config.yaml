# ============================================================================
# configs/speech/full-training/base-config.yaml - 全量训练基线配置
# ============================================================================
# 使用 configurable_modules 框架的多分类（音素/词分类）实验配置。
# 与 my_run 配置的区别：
#   - 使用 libribrain_speech_simplified 数据集（tmax=0.5s 短窗口）
#   - 使用 configurable_modules 的 ResnetBlock + Conv1d 架构
#   - 使用 CrossEntropyLoss（多分类）而非 MSE（二分类）
#   - batch_size=256（更大的批次）
#   - 306 通道输入（不降维到 204）
#
# 这是早期 LibriBrain 实验的配置，当前主实验使用 my_run/ 下的配置。
# ============================================================================

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  # --- 数据集定义 ---
  datasets:
    # 训练集：排除 Sherlock1 的两段 run 用于验证/测试
    train:
      - libribrain_speech_simplified:
          data_path: '/home/public/NIPS2025/dataset/libribrain/data'  # 原始 LibriBrain 数据路径
          preprocessing_str: 'bads+headpos+sss+notch+bp+ds'           # MEG 预处理序列
          standardize: true                                            # z-score 标准化
          tmin: 0.0                                                    # 起始时间（秒）
          tmax: 0.5                                                    # 窗口长度 0.5 秒（短窗口，50 个时间步 @100Hz）
          exclude_run_keys: [['0', '11', 'Sherlock1', '2'], ['0', '12', 'Sherlock1', '2']]
          preload_files: false

    # 验证集
    val:
      - libribrain_speech_simplified:
          data_path: '/home/public/NIPS2025/dataset/libribrain/data'
          standardize: true
          tmin: 0.0
          tmax: 0.5
          include_run_keys: [['0', '11', 'Sherlock1', '2']]
          preload_files: false

    # 测试集
    test:
      - libribrain_speech_simplified:
          data_path: '/home/public/NIPS2025/dataset/libribrain/data'
          standardize: true
          tmin: 0.0
          tmax: 0.5
          include_run_keys: [['0', '12', 'Sherlock1', '2']]
          preload_files: false

  # --- 数据加载器 ---
  dataloader:
    batch_size: 256      # 大批次训练（短窗口数据量更大）
    num_workers: 4

  # --- 通用设置 ---
  general:
    inMemory: False      # 惰性加载，不全部预载入内存

# ---------------------------------------------------------------------------
# 模型配置 - Conv1d + ResnetBlock 残差架构
# ---------------------------------------------------------------------------
# 模型由顺序层组成（从 configurable_modules/utils.py 的 modules_from_config 构建）
model:
  # 第一层：时序卷积（306 → 128 通道）
  - conv1d:
      in_channels: 306          # MEG 原始通道数（306 = 102 磁强计 + 204 梯度计）
      out_channels: 128
      kernel_size: 7            # 时间卷积核，覆盖 ~70ms
      stride: 1
      padding: 'same'           # 保持时间维度不变

  # 残差块：Conv → ELU → Conv → ELU（通道不变 128→128，核1×1降维）
  - resnet_block:
      model_config:
        - elu:
        - conv1d:
            in_channels: 128
            out_channels: 128
            kernel_size: 3
            stride: 1
            padding: 'same'
        - elu:
        - conv1d:
            in_channels: 128
            out_channels: 128
            kernel_size: 1       # 1×1 卷积，通道混合
            stride: 1
            padding: 'same'

  - elu:                        # ELU 激活函数

  # 步长卷积下采样：kernel=50, stride=25 → 时间维度压缩 25 倍
  - conv1d:
      in_channels: 128
      out_channels: 128
      kernel_size: 50
      stride: 25

  - elu:

  # 时序平滑卷积
  - conv1d:
      in_channels: 128
      out_channels: 128
      kernel_size: 7
      stride: 1
      padding: 'same'

  - elu:

  # 全连接等效层（kernel_size=4, padding=0 → 时间维度缩减3）
  - conv1d:
      in_channels: 128
      out_channels: 512
      kernel_size: 4
      padding: 0

  - relu:                       # ReLU 激活

  - dropout:
      p: 0.5                    # 50% Dropout 防止过拟合

  # 分类头：512 → 2（二分类：语音/静音）
  - conv1d:
      in_channels: 512
      out_channels: 2
      kernel_size: 1
      padding: 0

  - flatten:                    # 展平多维输出

# ---------------------------------------------------------------------------
# 损失函数配置
# ---------------------------------------------------------------------------
loss:
  name: cross_entropy           # 交叉熵损失（多分类标准损失）

# ---------------------------------------------------------------------------
# 优化器配置
# ---------------------------------------------------------------------------
optimizer:
  name: adam                    # Adam 优化器
  config:
    lr: 0.0003                  # 学习率 3e-4

# ---------------------------------------------------------------------------
# 训练器配置
# ---------------------------------------------------------------------------
trainer:
  max_epochs: 10                # 最大训练轮数

# ---------------------------------------------------------------------------
# 通用实验配置
# ---------------------------------------------------------------------------
general:
  wandb: True                   # 启用 Weights & Biases 实验追踪
  output_path: '/home/ljh/exp/work/libribrain-experiments/results/outputs/final-speech-results'
  checkpoint_path: '/home/ljh/exp/work/libribrain-experiments/results/checkpoints/final-speech-results'
  seed: 42                      # 随机种子
