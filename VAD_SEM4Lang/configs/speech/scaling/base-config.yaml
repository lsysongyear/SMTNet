# ============================================================================
# configs/speech/scaling/base-config.yaml - 数据缩放实验配置
# ============================================================================
# 用于研究训练数据量对模型性能影响的缩放实验。
# 与 full-training 配置的区别：
#   - 新增 train_fraction 参数（通过 search-space.yaml 搜索不同比例）
#   - 使用占位符 <DATA_PATH>, <RESULTS_PATH>, <CHECKPOINTS_PATH>
#   - max_epochs=20（更长的训练）
#
# 目的：评估模型在不同训练数据比例下的性能变化趋势。
# ============================================================================

# ---------------------------------------------------------------------------
# 数据配置
# ---------------------------------------------------------------------------
data:
  datasets:
    # 训练集（train_fraction 由搜索空间控制，用于缩放实验）
    train:
      - libribrain_speech_simplified:
          data_path: '<DATA_PATH>'                                  # 占位符，需替换为实际路径
          preprocessing_str: 'bads+headpos+sss+notch+bp+ds'
          standardize: true
          tmin: 0.0
          tmax: 0.5                                                 # 0.5 秒窗口
          exclude_run_keys: [['0', '11', 'Sherlock1', '2'], ['0', '12', 'Sherlock1', '2']]
          preload_files: false

    val:
      - libribrain_speech_simplified:
          data_path: '<DATA_PATH>'
          standardize: true
          tmin: 0.0
          tmax: 0.5
          include_run_keys: [['0', '11', 'Sherlock1', '2']]
          preload_files: false

    test:
      - libribrain_speech_simplified:
          data_path: '<DATA_PATH>'
          standardize: true
          tmin: 0.0
          tmax: 0.5
          include_run_keys: [['0', '12', 'Sherlock1', '2']]
          preload_files: false

  dataloader:
    batch_size: 256
    num_workers: 4

  general:
    inMemory: False
    train_fraction: 1.0          # 训练数据使用比例（100%=全量），搜索空间会覆盖此值

# ---------------------------------------------------------------------------
# 模型配置 - Conv1d + ResnetBlock 残差架构（与 full-training 相同）
# ---------------------------------------------------------------------------
model:
  - conv1d:
      in_channels: 306
      out_channels: 128
      kernel_size: 7
      stride: 1
      padding: 'same'

  - resnet_block:
      model_config:
        - elu:
        - conv1d:
            in_channels: 128
            out_channels: 128
            kernel_size: 3
            stride: 1
            padding: 'same'
        - elu:
        - conv1d:
            in_channels: 128
            out_channels: 128
            kernel_size: 1
            stride: 1
            padding: 'same'

  - elu:

  - conv1d:
      in_channels: 128
      out_channels: 128
      kernel_size: 50
      stride: 25

  - elu:

  - conv1d:
      in_channels: 128
      out_channels: 128
      kernel_size: 7
      stride: 1
      padding: 'same'

  - elu:

  - conv1d:
      in_channels: 128
      out_channels: 512
      kernel_size: 4
      padding: 0

  - relu:

  - dropout:
      p: 0.5

  - conv1d:
      in_channels: 512
      out_channels: 2
      kernel_size: 1
      padding: 0

  - flatten:

# ---------------------------------------------------------------------------
# 损失函数配置
# ---------------------------------------------------------------------------
loss:
  name: cross_entropy

# ---------------------------------------------------------------------------
# 优化器配置
# ---------------------------------------------------------------------------
optimizer:
  name: adam
  config:
    lr: 0.0003

# ---------------------------------------------------------------------------
# 训练器配置
# ---------------------------------------------------------------------------
trainer:
  max_epochs: 20                # 更长训练（缩放实验需要充分收敛）

# ---------------------------------------------------------------------------
# 通用实验配置
# ---------------------------------------------------------------------------
general:
  wandb: True                   # 启用 W&B 追踪
  output_path: '<RESULTS_PATH>/final-speech-scaling'          # 占位符
  checkpoint_path: '<CHECKPOINTS_PATH>/final-speech-scaling'  # 占位符
  seed: 42
