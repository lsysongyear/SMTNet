# ============================================================================
# configs/speech/my_run/search-space.yaml - 超参数搜索空间定义 (Brain_Magic_Speech_v1)
# ============================================================================
# 空间注意力 + FeatureEncoder + 门控多尺度短时卷积 + 深度可分离卷积 + BiLSTM
# ============================================================================

# 模型随机种子
'("general", "seed")' : [1]

# 数据划分随机种子
'("general", "split_seed")' : [42]

# input_dim: 输入通道数（SparKULee EEG 64 通道）
'("model", "brain_magic_speech_v7", "input_dim")' : [64]

# attention_dim: 空间注意力输出维度（同时也是整个模型的特征维度）
'("model", "brain_magic_speech_v7", "attention_dim")' : [128]

# output_dim: 输出维度（帧级 VAD = 1）
'("model", "brain_magic_speech_v7", "output_dim")' : [1]

# kernel_size: FeatureEncoder 卷积核大小
'("model", "brain_magic_speech_v7", "kernel_size")' : [40]

# depthwise_kernel: 深度可分离卷积核大小
'("model", "brain_magic_speech_v7", "depthwise_kernel")' : [30]

# num_blocks1: FeatureEncoder 块数
'("model", "brain_magic_speech_v7", "num_blocks1")' : [8]

# num_blocks2: 门控多尺度短时卷积层数
'("model", "brain_magic_speech_v7", "num_blocks2")' : [5]

# dropout: Dropout 概率
'("model", "brain_magic_speech_v7", "dropout")' : [0.1]

# n_subjects: 被试特化空间注意力层数
'("model", "brain_magic_speech_v7", "n_subjects")' : [85]

# 类别损失权重: [静音权重, 语音权重]
'("loss", "config", "weight")' : [[1.0, 1.0]]

# 损失函数类型
'("general", "loss_type")' : ['mse']

# 学习率
'("optimizer", "config", "lr")' : [0.001]
