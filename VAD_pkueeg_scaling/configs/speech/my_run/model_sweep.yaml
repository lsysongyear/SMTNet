# ============================================================================
# model_sweep.yaml — 多模型批量运行参数定义
# 用法: bash submit_pretrain_per_sub_5t5v.sh --models all
#       bash submit_pretrain_per_sub_5t5v.sh --models brain_magic_speech_v7,awavenet
# ============================================================================

brain_magic_speech_v7:
  input_dim: 57
  attention_dim: 128
  output_dim: 1
  kernel_size: 40
  depthwise_kernel: 30
  n_subjects: 25
  num_blocks1: 8
  num_blocks2: 19
  dropout: 0.1

brain_magic_no_short_conv:
  input_dim: 57
  attention_dim: 128
  output_dim: 1
  kernel_size: 40
  depthwise_kernel: 30
  n_subjects: 25
  num_blocks1: 8
  num_blocks2: 19
  dropout: 0.1

brain_magic_no_feature_encoder:
  input_dim: 57
  attention_dim: 128
  output_dim: 1
  kernel_size: 40
  depthwise_kernel: 30
  n_subjects: 25
  num_blocks1: 8
  num_blocks2: 19
  dropout: 0.1

brain_magic_no_subject_attn:
  input_dim: 57
  attention_dim: 128
  output_dim: 1
  kernel_size: 40
  depthwise_kernel: 30
  n_subjects: 25
  num_blocks1: 8
  num_blocks2: 19
  dropout: 0.1

awavenet:
  input_dim: 57
  output_dim: 1
  res_channels: 32
  skip_channels: 32
  num_res_layers: 12
  dilation_cycle: 4
  n_subjects: 25

cnn_lstm:
  input_channels: 57
  num_kernels: 5
  kernel_time: 25
  lstm_hidden: 4
  output_dim: 1
  n_subjects: 25

dilated_conv:
  input_channels: 57
  output_dim: 1
  n_layers: 3
  kernel_size: 3
  dilation_filters: 32
  n_subjects: 25

vlaai:
  input_channels: 57
  output_dim: 1
  nb_blocks: 16
  use_skip: true
  n_subjects: 25

eeg_conformer:
  input_dim: 57
  emb_size: 128
  depth: 6
  num_heads: 8
  kernel_size: 25
  pool_size: 8
  dropout: 0.1
  forward_expansion: 4
  n_subjects: 25
